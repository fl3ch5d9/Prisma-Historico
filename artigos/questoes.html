<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Simulados | Prisma Histórico</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;700&family=Inter:wght@300;400;600;800&family=Material+Icons&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/style.css">




<style>
:root{ --ouro:#eebc6c; --preto:#121212; --creme:#F5F5F0; --preto2:#1E1E1E; --borda:rgba(238,188,108,0.15); }
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--preto);color:var(--creme);font-family:'Inter',sans-serif}
.prisma-nav{position:fixed;top:0;left:0;width:100%;z-index:9999;display:flex;justify-content:space-between;align-items:center;padding:18px 5%;background:rgba(18,18,18,0.92);backdrop-filter:blur(20px);border-bottom:1px solid var(--borda)}
.prisma-logo{font-family:'Cormorant Garamond';font-size:26px;letter-spacing:0.18em;z-index:10001}
.prisma-logo span{color:var(--ouro);font-weight:700}
.prisma-menu-hamburguer{width:52px;height:52px;border:1px solid var(--borda);background:transparent;cursor:pointer;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:6px;z-index:10001;border-radius:50%}
.prisma-menu-hamburguer span{width:20px;height:1.5px;background:var(--ouro);display:block;transition:0.4s}
.prisma-nav.menu-aberto .prisma-menu-hamburguer span:nth-child(1){transform:translateY(7.5px) rotate(45deg)}
.prisma-nav.menu-aberto .prisma-menu-hamburguer span:nth-child(2){opacity:0}
.prisma-nav.menu-aberto .prisma-menu-hamburguer span:nth-child(3){transform:translateY(-7.5px) rotate(-45deg)}
.prisma-menu-links{position:fixed;inset:0;width:100vw;height:100vh;background:#0A0A0A;list-style:none;display:flex;flex-direction:column;justify-content:center;padding:12% 8%;gap:6px;transform:translateY(-100%);opacity:0;transition:0.8s cubic-bezier(0.77,0,0.175,1);pointer-events:none}
.prisma-nav.menu-aberto .prisma-menu-links{transform:translateY(0);opacity:1;pointer-events:all}
.prisma-menu-links li a{font-family:'Cormorant Garamond';font-size:clamp(32px,5vw,62px);color:var(--creme);text-decoration:none;display:flex;align-items:center;gap:18px;transform:translateY(120%);transition:0.6s}
.prisma-nav.menu-aberto .prisma-menu-links li a{transform:translateY(0)}
.prisma-menu-links li a:hover{color:var(--ouro);padding-left:20px}

.hero{padding:140px 5% 30px 5%;max-width:1100px;margin:auto}
.hero .tag{color:var(--ouro);font-size:11px;letter-spacing:0.22em;font-weight:800;background:rgba(238,188,108,0.1);border:1px solid rgba(238,188,108,0.2);padding:8px 16px;border-radius:100px;display:inline-block;margin-bottom:16px}
.hero h1{font-family:'Cormorant Garamond';font-size:clamp(36px,5vw,56px);line-height:0.9}
.hero h1 span{color:var(--ouro);font-style:italic}
.hero p{opacity:0.6;margin-top:12px;max-width:600px;line-height:1.6;font-size:14.5px}

.barra-busca{max-width:1100px;margin:20px auto;padding:0 5%;display:grid;grid-template-columns:1fr auto;gap:12px}
#busca-prisma{width:100%;padding:16px 20px;border-radius:100px;border:1px solid var(--borda);background:var(--preto2);color:#fff;font-size:15px;outline:none;transition:0.3s}
#busca-prisma:focus{border-color:var(--ouro);box-shadow:0 0 0 3px rgba(238,188,108,0.15)}
.filtro-tema{padding:12px 20px;border-radius:100px;border:1px solid var(--borda);background:var(--preto2);color:var(--ouro);font-weight:700}

.wrapper{max-width:900px;margin:20px auto;padding:0 5% 80px 5%}
#lista-questoes{display:flex;flex-direction:column;gap:20px}
.card-questao{background:var(--preto2);border:1px solid var(--borda);border-radius:18px;padding:26px;transition:0.3s}
.card-questao:hover{border-color:rgba(238,188,108,0.3);transform:translateY(-2px)}
.badge{font-size:10px;letter-spacing:0.12em;font-weight:800;padding:6px 12px;border-radius:100px;background:rgba(238,188,108,0.1);border:1px solid rgba(238,188,108,0.2);color:var(--ouro);text-transform:uppercase}
.card-questao h3{font-family:'Inter';font-size:16.5px;line-height:1.5;margin:14px 0 6px 0;font-weight:600}
.alts{display:flex;flex-direction:column;gap:8px;margin-top:16px}
.alts button{width:100%;text-align:left;padding:14px 16px;border-radius:10px;border:1px solid rgba(255,255,255,0.08);background:#121212;color:var(--creme);cursor:pointer;transition:0.2s;font-size:14px}
.alts button:hover{border-color:var(--ouro);background:rgba(238,188,108,0.06)}
.alts button.certo{background:rgba(46,204,113,0.15)!important;border-color:#2ecc71!important;color:#fff}
.alts button.errado{background:rgba(231,76,60,0.15)!important;border-color:#e74c3c!important;color:#fff}
details{margin-top:18px}
details summary{color:var(--ouro);cursor:pointer;font-weight:800;font-size:12px;letter-spacing:0.08em;text-transform:uppercase;list-style:none}
details summary::-webkit-details-marker{display:none}
.comentario-box{margin-top:12px;background:#0E0E0E;border:1px dashed rgba(238,188,108,0.25);padding:16px;border-radius:10px;font-size:14px;line-height:1.7;opacity:0.85}
</style>
</head>
<body>

<nav class="prisma-nav" id="prismaNav">
    <div class="prisma-logo"><span>Prisma</span> Histórico</div>
    <button class="prisma-menu-hamburguer"><span></span><span></span><span></span></button>
    <ul class="prisma-menu-links">
        <li><a href="../index.html">Início</a></li>
        <li><a href="sobre.html">Sobre</a></li>
        <li><a href="artigos.html">Artigos</a></li>
        <li><a href="quiz.html">Quiz</a></li>
        <li><a href="ebook.html">E-book</a></li>
    </ul>
</nav>

<header class="hero">
    <span class="tag">⚔️ TREINE COMO SE FOSSE A PROVA</span>
    <h1>Simulados <span>comentados</span></h1>
    <p>Banco com questões de vestibulares e ENEM comentadas no método Prisma - sem decoreba, só raciocínio.</p>
</header>

<div class="barra-busca">
    <input type="text" id="busca-prisma" placeholder="🔍 Buscar... ex: engenho, pombalino, mascates, Vargas">
    <select id="filtroNivel" class="filtro-tema"><option value="">Todos</option><option>Fácil</option><option>Médio</option><option>Difícil</option></select>
</div>

<div class="wrapper">
  <div id="lista-questoes"><p style="opacity:0.5;text-align:center;padding:40px">Carregando questões...</p></div>
</div>

<script>
let todasQuestoes = [];
fetch('questoes.json').then(r=>r.json()).then(dados=>{
    todasQuestoes=dados; renderPrisma(todasQuestoes);
}).catch(()=>{document.getElementById('lista-questoes').innerHTML='<p style=color:#fff;text-align:center;padding:40px>Erro: coloca o questoes.json dentro da pasta artigos/</p>'});

function renderPrisma(lista){
  const c=document.getElementById('lista-questoes'); c.innerHTML='';
  if(lista.length==0){c.innerHTML='<p style=opacity:.5;text-align:center;padding:40px>Nenhuma questão encontrada 🔍</p>';return;}
  lista.forEach(q=>{
    const div=document.createElement('div'); div.className='card-questao';
    div.innerHTML=`<span class="badge">${q.nivel} • ${q.tema}</span><h3>${q.id}. ${q.pergunta}</h3><div class="alts" id="alts-${q.id}"></div><details><summary>💡 Ver comentário gabaritado</summary><div class="comentario-box">${q.comentario}</div></details>`;
    c.appendChild(div);
    const altsDiv=div.querySelector(`#alts-${q.id}`);
    Object.entries(q.alternativas).forEach(([letra,txt])=>{
      const btn=document.createElement('button'); btn.innerHTML=`<b>${letra})</b> ${txt}`;
      btn.onclick=()=>{
        [...altsDiv.children].forEach(b=>{b.classList.remove('certo','errado'); b.disabled=true;});
        if(letra===q.gabarito){btn.classList.add('certo');}else{btn.classList.add('errado'); [...altsDiv.children].find(b=>b.innerHTML.startsWith(`<b>${q.gabarito})`)).classList.add('certo');}
      };
      altsDiv.appendChild(btn);
    });
  });
}
function filtrar(){
  const t=document.getElementById('busca-prisma').value.toLowerCase();
  const n=document.getElementById('filtroNivel').value.toLowerCase();
  renderPrisma(todasQuestoes.filter(q=> (q.tema.toLowerCase().includes(t)||q.pergunta.toLowerCase().includes(t)) && (n==''||q.nivel.toLowerCase().includes(n))));
}
document.getElementById('busca-prisma').addEventListener('input',filtrar);
document.getElementById('filtroNivel').addEventListener('change',filtrar);

const nav=document.getElementById('prismaNav');const btn=nav.querySelector('.prisma-menu-hamburguer');
btn.addEventListener('click',()=>{nav.classList.toggle('menu-aberto');document.body.style.overflow=nav.classList.contains('menu-aberto')?'hidden':''});
</script>
</body>
</html>
