<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Prisma Histórico - Detetive da Colônia</title>
<link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@700&family=Inter:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#121212;--card:#1e1e1e;--gold:#d2b48c;--border:#2a2a2a;--ouro:#E5B769;--creme:#F5E6C8;--borda:rgba(255,255,255,0.08)}
*{box-sizing:border-box}
body{background:var(--bg)!important;margin:0;font-family:'Inter',sans-serif;color:#fff;padding-top:80px;overflow-x:hidden}
.quiz-app{max-width:800px;margin:0 auto;padding:20px 20px 40px}
.tabuleiro{width:100%;background:#1a1a1a;border:1px solid var(--borda);border-radius:16px;padding:16px;display:flex;gap:8px;justify-content:space-between;margin-bottom:22px;overflow-x:auto}
.casa{min-width:62px;height:62px;border:1px solid #2a2a2a;border-radius:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:10px;color:#666;position:relative;background:#121212;transition:.4s}
.casa.ativa{border-color:var(--ouro);background:#2c241e;color:var(--ouro);box-shadow:0 0 12px rgba(229,183,105,0.3)}
.casa.concluida{background:#1a3322;border-color:#2ecc71;color:#2ecc71}
.peao{position:absolute;top:-10px;right:-6px;font-size:18px;transition:.4s}
.progress-wrap{height:4px;background:#222;border-radius:10px;margin-bottom:25px;overflow:hidden}
.progress-bar{height:100%;background:var(--gold);width:0%;transition:.4s}
.quiz-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px;color:#888;font-size:13px}
.quiz-card{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:28px;box-shadow:0 10px 30px rgba(0,0,0,0.3)}
.page-tag{background:#2c241e;color:var(--gold);border:1px solid #3e352d;font-size:11px;padding:5px 10px;border-radius:20px;letter-spacing:0.08em}
.question{font-size:19px;line-height:1.5;margin:16px 0 8px;font-weight:600;font-family:'Cormorant Garamond',serif}
.dica{font-size:13px;color:#9a8c7a;background:#1e1e1e;border-left:3px solid var(--ouro);padding:10px 12px;margin-bottom:18px;border-radius:0 8px 8px 0}
.options{display:grid;gap:10px}
.opt{padding:16px;background:#252525;border:1px solid var(--border);border-radius:10px;cursor:pointer;display:flex;gap:12px;transition:.2s}
.opt:hover{border-color:#444;background:#2a2a2a}
.opt.selected{border-color:var(--gold);background:#2c241e}
.opt.correct{border-color:#2ecc71!important;background:#1a3322!important}
.opt.wrong{border-color:#e74c3c!important;background:#3a1a1a!important}
.opt b{color:var(--gold);min-width:20px}
.actions{margin-top:24px;display:flex;justify-content:space-between;align-items:center}
.btn{padding:12px 24px;border-radius:8px;border:0;font-weight:700;cursor:pointer;background:var(--gold);color:#121212}
.btn:disabled{opacity:.4;cursor:not-allowed}
.result{text-align:center;padding:40px 20px}
.result h2{font-size:32px;margin-bottom:10px;font-family:'Cormorant Garamond',serif}
.prisma-nav{position:fixed!important;top:0!important;left:0!important;width:100%!important;z-index:9999!important;display:flex!important;justify-content:space-between!important;align-items:center!important;padding:18px 5%!important;background:rgba(18,18,18,0.92)!important;backdrop-filter:blur(20px)!important;border-bottom:1px solid var(--borda)!important}
.prisma-logo{font-family:'Cormorant Garamond',serif!important;font-size:26px!important;letter-spacing:0.18em!important;z-index:10001!important}
.prisma-logo span{color:var(--ouro)!important;font-weight:700!important}
.lang-switch{display:flex;gap:6px;z-index:10001}
.lang-switch button{background:transparent;border:1px solid var(--borda);color:var(--creme);padding:6px 10px;border-radius:20px;cursor:pointer;font-size:11px}
.lang-switch button.active{background:var(--ouro);color:#121212;border-color:var(--ouro);font-weight:800}
/* HAMBURGUER CORRIGIDO - COM ESPAÇO */
.prisma-menu-hamburguer{width:52px;height:52px;border:1px solid var(--borda);background:transparent;cursor:pointer;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:6px;z-index:10001;border-radius:50%}
.prisma-menu-hamburguer span{width:20px;height:1.5px;background:var(--ouro);display:block;transition:0.4s}
.prisma-nav.menu-aberto.prisma-menu-hamburguer span:nth-child(1){transform:translateY(7.5px) rotate(45deg)}
.prisma-nav.menu-aberto.prisma-menu-hamburguer span:nth-child(2){opacity:0}
.prisma-nav.menu-aberto.prisma-menu-hamburguer span:nth-child(3){transform:translateY(-7.5px) rotate(-45deg)}
.prisma-menu-links{position:fixed;top:0;left:0;width:280px;max-width:80vw;height:100vh;background:#0A0A0A;list-style:none;display:flex;flex-direction:column;padding:100px 0 0 30px;gap:14px;transform:translateX(-100%);transition:0.4s;pointer-events:none;z-index:10000;border-right:1px solid var(--borda)}
.prisma-nav.menu-aberto.prisma-menu-links{transform:translateX(0);pointer-events:all}
.prisma-menu-links li a{font-size:13px;letter-spacing:0.08em;text-transform:uppercase;color:var(--creme);text-decoration:none;display:flex;align-items:center;gap:12px;opacity:0.8}
.prisma-menu-links li a:hover{color:var(--ouro);opacity:1}
</style>
</head>
<body>
<nav class="prisma-nav" id="prismaNav">
  <div class="prisma-logo"><span>Prisma</span> Histórico</div>
  <div style="display:flex;align-items:center;gap:12px">
    <div class="lang-switch">
      <button onclick="setLang('pt')" id="btn-pt" class="active">PT</button>
      <button onclick="setLang('en')" id="btn-en">EN</button>
      <button onclick="setLang('es')" id="btn-es">ES</button>
      <button onclick="setLang('fr')" id="btn-fr">FR</button>
    </div>
    <button class="prisma-menu-hamburguer" id="btnMenu"><span></span><span></span><span></span></button>
  </div>
  <ul class="prisma-menu-links">
      <li><a href="../index.html"><span class="material-icons">home</span> INÍCIO</a></li>
      <li><a href="sobre.html"><span class="material-icons">info</span> SOBRE</a></li>
      <li><a href="afiliados.html"><span class="material-icons">handshake</span> AFILIADOS</a></li>
      <li><a href="artigos.html"><span class="material-icons">article</span> ARTIGOS</a></li>
      <li><a href="curiosidades.html"><span class="material-icons">lightbulb</span> CURIOSIDADES</a></li>
      <li><a href="quiz.html"><span class="material-icons">quiz</span> QUIZ</a></li>
      <li><a href="ebook.html"><span class="material-icons">menu_book</span> E-BOOK</a></li>
      <li><a href="loja.html"><span class="material-icons">store</span> LOJA</a></li>
      <li><a href="turismo.html"><span class="material-icons">public</span> TURISMO COLONIAL</a></li>
  </ul>
</nav>
<div class="quiz-app">
  <div id="tabuleiro" class="tabuleiro"></div>
  <div class="progress-wrap"><div class="progress-bar" id="bar"></div></div>
  <div class="quiz-header"><span id="qCount">Caso 1 / 10</span><span id="scoreCount">0 pistas</span></div>
  <div class="quiz-card" id="quizCard"></div>
</div>
<script>
const T_UI={
pt:{acertos:"pistas",proxima:"Investigar →",refazer:"Recomeçar Investigação",msg_win:"Caso Resolvido! 🔍 Você desvendou a Colônia!",msg_mid:"Bom detetive! Quase lá.",msg_low:"O mistério continua... Estude os arquivos."},
en:{acertos:"clues",proxima:"Investigate →",refazer:"Restart",msg_win:"Case Solved! 🔍",msg_mid:"Good detective!",msg_low:"Study more."},
es:{acertos:"pistas",proxima:"Investigar →",refazer:"Rehacer",msg_win:"¡Caso Resuelto! 🔍",msg_mid:"¡Buen trabajo!",msg_low:"Estudia más."},
fr:{acertos:"indices",proxima:"Enquêter →",refazer:"Recommencer",msg_win:"Affaire Résolue! 🔍",msg_mid:"Bien joué!",msg_low:"Étudiez plus."}
};
const QUIZ={
pt:[
  { pagina:"CASO 01 - O Alvará", pergunta:"1755, Belém do Pará. Um documento secreto do Marquês de Pombal chega. Casamentos entre brancos e indígenas estão sendo julgados como 'infâmia de sangue'. Como detetive, o que o Alvará Régio realmente determina?", dica:"Pista: Pombal queria povoar a Amazônia e acabar com o poder dos jesuítas.", alt:[["A","Que seriam exilados"],["B","Que NÃO sofreriam infâmia alguma e seriam protegidos pelo Rei"],["C","Que pagariam imposto"],["D","Que seriam escravizados"]], resp:"B", casa:"Belém" },
  { pagina:"CASO 02 - O Estado na Igreja", pergunta:"Você investiga os aldeamentos jesuíticos. Eles ficaram tão ricos que os colonos os chamavam de...", dica:"Tinham exército, dinheiro e terras próprios.", alt:[["A","Quinto Real"],["B","Capitania"],["C","Estado dentro do Estado"],["D","Cativeiro"]], resp:"C", casa:"Aldeia" },
  { pagina:"CASO 03", pergunta:"Distrito Diamantino, 1734. Por que Portugal isolou a região com cercas e passaportes?", dica:"Diamante valia mais que ouro.", alt:[["A","Proteger índios"],["B","Controlar preço e evitar contrabando"],["C","Guerra com Espanha"],["D","Esconder ouro falso"]], resp:"B", casa:"Diamantes" },
  { pagina:"CASO 04", pergunta:"Contestado, 1912. O que a ferrovia de Percival Farquhar fez?", dica:"Madeira e terras dadas para estrangeira.", alt:[["A","Trouxe progresso"],["B","Expulsou caboclos, dando tudo para a Lumber"],["C","Construída por escravos"],["D","Ligou aos EUA"]], resp:"B", casa:"Ferrovia" },
  { pagina:"CASO 05", pergunta:"Você encontra 'redutos'. Quem liderava?", dica:"Monges como José Maria.", alt:[["A","Oficiais"],["B","Monges beatos, comunidades coletivas"],["C","Jesuítas"],["D","Políticos"]], resp:"B", casa:"Reduto" },
  { pagina:"CASO 06", pergunta:"Rio, 1891. O que foi a 1ª Revolta da Armada?", dica:"Custódio de Melo.", alt:[["A","Escravos"],["B","Marinheiros contra Deodoro"],["C","Exército vs Marinha"],["D","Argentina"]], resp:"B", casa:"Baía" },
  { pagina:"CASO 07", pergunta:"1893. Como Floriano sem navios venceu?", dica:"Frota de Papelão.", alt:[["A","Portugal"],["B","Frota de Papelão"],["C","30 dias"],["D","Aviões"]], resp:"B", casa:"Rio" },
  { pagina:"CASO 08", pergunta:"Desterro, 1894. O que aconteceu em Anhatomirim?", dica:"Homenagem a Floriano.", alt:[["A","Anistia"],["B","Fuzilamentos e virou Florianópolis"],["C","Vendeu ilha"],["D","Café"]], resp:"B", casa:"Ilha" },
  { pagina:"CASO 09", pergunta:"Qual a crítica de Lima Barreto em Policarpo Quaresma?", dica:"Vira carcereiro e se decepciona.", alt:[["A","República perfeita"],["B","República violenta e corrupta"],["C","Monarquia volta"],["D","Marinha certa"]], resp:"B", casa:"Arquivo" },
  { pagina:"CASO 10", pergunta:"1915. O que o Exército usou pela primeira vez no Contestado?", dica:"Santos-Dumont.", alt:[["A","Tanques"],["B","Submarinos"],["C","Aviação militar"],["D","Metralhadoras"]], resp:"C", casa:"CÉU" },
],
en:[],es:[],fr:[]
};
let lang = localStorage.getItem('prisma_lang')||'pt';
let atual=0,acertos=0,respondido=false;
const card=document.getElementById('quizCard'),bar=document.getElementById('bar'),qCount=document.getElementById('qCount'),sCount=document.getElementById('scoreCount'),tab=document.getElementById('tabuleiro');
function getDados(){ return (QUIZ[lang] && QUIZ[lang].length > 0)? QUIZ[lang] : QUIZ.pt; }
function renderTabuleiro(){
  const dados = getDados();
  tab.innerHTML = dados.map((q,i)=>{
    let cls = i < acertos? 'concluida' : i==atual? 'ativa' : '';
    let peao = i==atual? '<div class="peao">🕵️</div>' : i<acertos? '<div class="peao">✓</div>' : '';
    return `<div class="casa ${cls}">${peao}<div class="icon">${i==9?'👑':i>5?'⚓':i>2?'💎':'📜'}</div><span>${q.casa}</span></div>`
  }).join('');
}
function setLang(l){
  lang=l; localStorage.setItem('prisma_lang',l);
  document.querySelectorAll('.lang-switch button').forEach(b=>b.classList.remove('active'));
  document.getElementById('btn-'+l).classList.add('active');
  atual=0; acertos=0; render();
}
function render(){
  const quizData = getDados();
  const q=quizData[atual];respondido=false;
  renderTabuleiro();
  bar.style.width=`${(atual/quizData.length)*100}%`;
  qCount.textContent=`Caso ${atual+1} / ${quizData.length}`;
  sCount.textContent=`${acertos} ${T_UI[lang].acertos}`;
  card.innerHTML=`<span class="page-tag">${q.pagina}</span><div class="question">🕵️ ${q.pergunta}</div><div class="dica">💡 ${q.dica}</div><div class="options">${q.alt.map(a=>`<div class="opt" data-l="${a[0]}"><b>${a[0]})</b><span>${a[1]}</span></div>`).join('')}</div><div class="actions"><span style="font-size:12px;color:#666">Casa ${atual+1}: ${q.casa}</span><button class="btn" id="nextBtn" disabled>${T_UI[lang].proxima}</button></div>`;
  document.querySelectorAll('.opt').forEach(el=>{
    el.onclick=()=>{
      if(respondido)return;respondido=true;
      document.querySelectorAll('.opt').forEach(o=>o.classList.remove('selected'));
      el.classList.add('selected');
      const certa=q.resp;
      if(el.dataset.l===certa){acertos++;el.classList.add('correct')}else{el.classList.add('wrong');document.querySelector(`[data-l="${certa}"]`).classList.add('correct')}
      sCount.textContent=`${acertos} ${T_UI[lang].acertos}`;
      document.getElementById('nextBtn').disabled=false
    }
  });
  document.getElementById('nextBtn').onclick=()=>{atual++;if(atual<quizData.length)render();else final()}
}
function final(){
  bar.style.width=`100%`; renderTabuleiro();
  const t=T_UI[lang];
  card.innerHTML=`<div class="result"><h2>${acertos}/10</h2><p>${acertos==10?t.msg_win:acertos>6?t.msg_mid:t.msg_low}</p><br><button class="btn" onclick="location.reload()">${t.refazer}</button></div>`
}
setLang(lang);
const nav=document.getElementById('prismaNav'),btn=document.getElementById('btnMenu');
btn.addEventListener('click',(e)=>{e.stopPropagation();nav.classList.toggle('menu-aberto');document.body.style.overflow=nav.classList.contains('menu-aberto')?'hidden':''});
</script>
</body>
</html>
