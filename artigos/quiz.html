<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Prisma Histórico - Quiz</title>
<link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@700&family=Inter:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#121212;--card:#1e1e1e;--gold:#d2b48c;--border:#2a2a2a;--ouro:#E5B769;--creme:#F5E6C8;--borda:rgba(255,255,255,0.08)}
*{box-sizing:border-box}
body{background:var(--bg)!important;margin:0;font-family:'Inter',sans-serif;color:#fff;padding-top:72px;overflow-x:hidden}
.quiz-app{max-width:700px;margin:0 auto;padding:30px 20px 40px}
.progress-wrap{height:4px;background:#222;border-radius:10px;margin-bottom:25px;overflow:hidden}
.progress-bar{height:100%;background:var(--gold);width:0%;transition:.4s}
.quiz-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px;color:#888;font-size:13px}
.quiz-card{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:28px}
.page-tag{background:#2c241e;color:var(--gold);border:1px solid #3e352d;font-size:11px;padding:4px 8px;border-radius:20px}
.question{font-size:20px;line-height:1.4;margin:16px 0 24px;font-weight:600}
.options{display:grid;gap:10px}
.opt{padding:16px;background:#252525;border:1px solid var(--border);border-radius:10px;cursor:pointer;display:flex;gap:12px;transition:.2s}
.opt:hover{border-color:#444;background:#2a2a2a}
.opt.selected{border-color:var(--gold);background:#2c241e}
.opt.correct{border-color:#2ecc71!important;background:#1a3322!important}
.opt.wrong{border-color:#e74c3c!important;background:#3a1a1a!important}
.opt b{color:var(--gold);min-width:20px}
.actions{margin-top:24px;display:flex;justify-content:flex-end}
.btn{padding:12px 24px;border-radius:8px;border:0;font-weight:700;cursor:pointer;background:var(--gold);color:#121212}
.btn:disabled{opacity:.4;cursor:not-allowed}
.result{text-align:center;padding:40px 20px}
.result h2{font-size:32px;margin-bottom:10px}
.prisma-nav{position:fixed!important;top:0!important;left:0!important;width:100%!important;z-index:9999!important;display:flex!important;justify-content:space-between!important;align-items:center!important;padding:18px 5%!important;background:rgba(18,18,18,0.92)!important;backdrop-filter:blur(20px)!important;border-bottom:1px solid var(--borda)!important}
.prisma-logo{font-family:'Cormorant Garamond',serif!important;font-size:26px!important;letter-spacing:0.18em!important;z-index:10001!important}
.prisma-logo span{color:var(--ouro)!important;font-weight:700!important}
.lang-switch{display:flex;gap:6px;z-index:10001}
.lang-switch button{background:transparent;border:1px solid var(--borda);color:var(--creme);padding:6px 10px;border-radius:20px;cursor:pointer;font-size:11px}
.lang-switch button.active{background:var(--ouro);color:#121212;border-color:var(--ouro);font-weight:800}
.prisma-menu-hamburguer{width:52px!important;height:52px!important;border:1px solid var(--borda)!important;background:transparent!important;cursor:pointer!important;display:flex!important;flex-direction:column!important;justify-content:center!important;align-items:center!important;gap:6px!important;z-index:10001!important;border-radius:50%!important}
.prisma-menu-hamburguer span{width:20px!important;height:1.5px!important;background:var(--ouro)!important;display:block!important;transition:0.25s!important}
.prisma-nav.menu-aberto.prisma-menu-hamburguer span:nth-child(1){transform:translateY(7px) rotate(45deg)!important}
.prisma-nav.menu-aberto.prisma-menu-hamburguer span:nth-child(2){opacity:0!important}
.prisma-nav.menu-aberto.prisma-menu-hamburguer span:nth-child(3){transform:translateY(-7px) rotate(-45deg)!important}
.prisma-menu-links{position:fixed!important;top:0!important;left:0!important;width:280px!important;max-width:80vw!important;height:100vh!important;background:#0A0A0A!important;list-style:none!important;display:flex!important;flex-direction:column!important;padding:100px 0 0 30px!important;gap:14px!important;transform:translateX(-100%)!important;transition:0.28s!important;pointer-events:none!important;z-index:10000!important;border-right:1px solid rgba(238,188,108,0.15)!important}
.prisma-nav.menu-aberto.prisma-menu-links{transform:translateX(0)!important;pointer-events:all!important}
.prisma-menu-links li a{font-size:13px!important;letter-spacing:0.08em!important;text-transform:uppercase!important;color:var(--creme)!important;text-decoration:none!important;display:flex!important;align-items:center!important;gap:12px!important;opacity:0.8!important}
.prisma-menu-links li a:hover{color:var(--ouro)!important;opacity:1!important}
</style>
</head>
<body>
<nav class="prisma-nav" id="prismaNav">
  <div class="prisma-logo"><span>Prisma</span> Histórico</div>
  <div style="display:flex;align-items:center;gap:12px">
    <div class="lang-switch">
      <button onclick="setLang('pt')" id="btn-pt" class="active">PT</button>
      <button onclick="setLang('en')" id="btn-en">EN</button>
      <button onclick="setLang('es')" id="btn-es">ES</button>
      <button onclick="setLang('fr')" id="btn-fr">FR</button>
    </div>
    <button class="prisma-menu-hamburguer" id="btnMenu"><span></span><span></span><span></span></button>
  </div>
  <ul class="prisma-menu-links">
       <li><a href="../index.html"><span class="material-icons">home</span> INÍCIO</a></li>
       <li><a href="sobre.html"><span class="material-icons">info</span> SOBRE</a></li>
       <li><a href="afiliados.html"><span class="material-icons">handshake</span> AFILIADOS</a></li>
       <li><a href="artigos.html"><span class="material-icons">article</span> ARTIGOS</a></li>
       <li><a href="curiosidades.html"><span class="material-icons">lightbulb</span> CURIOSIDADES</a></li>
       <li><a href="quiz.html"><span class="material-icons">quiz</span> QUIZ</a></li>
       <li><a href="ebook.html"><span class="material-icons">menu_book</span> E-BOOK</a></li>
       <li><a href="loja.html"><span class="material-icons">store</span> LOJA</a></li>
       <li><a href="turismo.html"><span class="material-icons">public</span> TURISMO COLONIAL</a></li>
      </ul>
</nav>
<div class="quiz-app">
  <div class="progress-wrap"><div class="progress-bar" id="bar"></div></div>
  <div class="quiz-header"><span id="qCount">1 / 17</span><span id="scoreCount">0 acertos</span></div>
  <div class="quiz-card" id="quizCard"></div>
</div>
<script>
const T_UI={
pt:{acertos:"acertos",proxima:"Próxima",refazer:"Refazer",msg_win:"Brabo demais! 🔥 Você gabaritou!",msg_mid:"Mandou bem!",msg_low:"Estuda mais as páginas e tenta de novo."},
en:{acertos:"correct",proxima:"Next",refazer:"Retry",msg_win:"Insane! 🔥 Perfect score!",msg_mid:"Good job!",msg_low:"Study the pages and try again."},
es:{acertos:"aciertos",proxima:"Siguiente",refazer:"Rehacer",msg_win:"¡Increíble! 🔥 ¡Puntaje perfecto!",msg_mid:"¡Bien hecho!",msg_low:"Estudia más las páginas e intenta de nuevo."},
fr:{acertos:"correct",proxima:"Suivant",refazer:"Recommencer",msg_win:"Incroyable! 🔥 Score parfait!",msg_mid:"Bien joué!",msg_low:"Étudiez les pages et réessayez."}
};
const QUIZ={
pt:[
  { pagina:"75", pergunta:"O Alvará Régio de 4 de abril de 1755, emitido pelo Marquês de Pombal, trazia uma importante reconfiguração jurídica sobre o casamento interracial. O que ele estipulava?", alt:[["A","Perderiam seus cargos públicos e seriam exilados."],["B","Não sofreriam qualquer infâmia jurídica ou mácula de sangue, tornando-se credores da real atenção."],["C","Seriam obrigados a pagar imposto de miscigenação."],["D","Seriam subordinados às lideranças tribais."]], resp:"B"},
  { pagina:"75", pergunta:"Na Amazônia, a eficiência dos jesuítas gerou riquezas que transformaram os aldeamentos num:", alt:[["A","Quinto Real de Aluvião"],["B","Distrito Diamantino do Norte"],["C","Estado dentro do Estado e Igreja dentro da Igreja"],["D","Cativeiro Transatlântico"]], resp:"C"},
  { pagina:"109", pergunta:"O que foi a Primeira Revolta da Armada (1891)?", alt:[["A","Revolta de escravos na Bahia"],["B","Motim da Marinha contra Deodoro após ele fechar o Congresso"],["C","Revolta do Exército contra a Marinha"],["D","Conflito Brasil e Argentina"]], resp:"B"},
  { pagina:"109", pergunta:"O que foi a crise do 'Encilhamento'?", alt:[["A","Bolha financeira com inflação e desemprego"],["B","Seca que matou o gado"],["C","Greve dos fabricantes de sela"],["D","Operação da Marinha"]], resp:"A"},
  { pagina:"109", pergunta:"Quem liderou a Primeira Revolta da Armada?", alt:[["A","Saldanha da Gama"],["B","Custódio de Melo, exigindo renúncia de Deodoro"],["C","Floriano Peixoto"],["D","Lima Barreto"]], resp:"B"},
  { pagina:"113", pergunta:"Motivo central da Segunda Revolta da Armada (1893)?", alt:[["A","Floriano se recusou a convocar novas eleições"],["B","Aumento do café"],["C","Proibição do tupi-guarani"],["D","Disputa da ferrovia no Contestado"]], resp:"A"},
  { pagina:"113", pergunta:"Como Floriano venceu sem navios?", alt:[["A","Pediu ajuda a Portugal"],["B","Comprou frota mercenária, a Frota de Papagaio"],["C","Construiu navios em 30 dias"],["D","Usou aviões"]], resp:"B"},
  { pagina:"113", pergunta:"Papel dos EUA na Segunda Revolta?", alt:[["A","Apoiaram revoltosos"],["B","Navios americanos garantiram abertura do porto do Rio"],["C","Ficaram neutros"],["D","Bombardearam SC"]], resp:"B"},
  { pagina:"113", pergunta:"O que ocorreu em SC após a derrota rebelde?", alt:[["A","Anistia geral"],["B","Fuzilamento em Anhatomirim e Desterro virou Florianópolis"],["C","Ilha vendida"],["D","Construiu ferrovia"]], resp:"B"},
  { pagina:"114", pergunta:"Como Policarpo Quaresma é caracterizado no início?", alt:[["A","Político corrupto"],["B","Nacionalista ingênuo que defende tupi-guarani"],["C","Marinheiro revoltoso"],["D","Monge do Contestado"]], resp:"B"},
  { pagina:"114", pergunta:"Ponto de virada de Quaresma na Revolta?", alt:[["A","Fica rico"],["B","Vira carcereiro, vê torturas e se decepciona"],["C","Descobre ouro"],["D","Vira presidente"]], resp:"B"},
  { pagina:"114", pergunta:"Por que Quaresma é condenado à morte?", alt:[["A","Roubou cofre"],["B","Escreveu carta contra fuzilamentos"],["C","Liderou Armada"],["D","Recusou falar português"]], resp:"B"},
  { pagina:"114", pergunta:"Crítica de Lima Barreto via Quaresma?", alt:[["A","República trouxe liberdade"],["B","República trouxe ditadura violenta e corrupta"],["C","Monarquia deveria voltar"],["D","Marinha sempre certa"]], resp:"B"},
  { pagina:"117", pergunta:"O que foi a Guerra do Contestado?", alt:[["A","Conflito naval"],["B","Maior conflito messiânico entre PR e SC"],["C","Revolta de escravos"],["D","Guerra com Argentina"]], resp:"B"},
  { pagina:"117", pergunta:"Estopim socioeconômico do Contestado?", alt:[["A","Ferrovia de Farquhar que expulsou camponeses"],["B","Fechamento do Congresso"],["C","Frota de Papagaio"],["D","Tupi-guarani oficial"]], resp:"A"},
  { pagina:"117", pergunta:"Quem eram os monges e redutos?", alt:[["A","Soldados"],["B","Líderes religiosos e comunidades coletivas"],["C","Jesuítas na Amazônia"],["D","Políticos separatistas"]], resp:"B"},
  { pagina:"117", pergunta:"Inovação militar usada no Contestado?", alt:[["A","Tanques"],["B","Submarinos"],["C","Aviação militar"],["D","Frota de Papagaio"]], resp:"C"},
],
en:[],es:[],fr:[]
};
let lang = localStorage.getItem('prisma_lang')||'pt';
let atual=0,acertos=0,respondido=false;
const card=document.getElementById('quizCard'),bar=document.getElementById('bar'),qCount=document.getElementById('qCount'),sCount=document.getElementById('scoreCount');
function setLang(l){
  lang=l; localStorage.setItem('prisma_lang',l);
  document.querySelectorAll('.lang-switch button').forEach(b=>b.classList.remove('active'));
  document.getElementById('btn-'+l).classList.add('active');
  atual=0; acertos=0; render();
}
function render(){
  const quizData=QUIZ[lang]||QUIZ.pt;
  const q=quizData[atual];respondido=false;
  bar.style.width=`${(atual/quizData.length)*100}%`;
  qCount.textContent=`${atual+1} / ${quizData.length}`;
  sCount.textContent=`${acertos} ${T_UI[lang].acertos}`;
  card.innerHTML=`<span class="page-tag">P. ${q.pagina}</span><div class="question">${q.pergunta}</div><div class="options">${q.alt.map(a=>`<div class="opt" data-l="${a[0]}"><b>${a[0]})</b><span>${a[1]}</span></div>`).join('')}</div><div class="actions"><button class="btn" id="nextBtn" disabled>${T_UI[lang].proxima}</button></div>`;
  document.querySelectorAll('.opt').forEach(el=>{
    el.onclick=()=>{
      if(respondido)return;respondido=true;
      document.querySelectorAll('.opt').forEach(o=>o.classList.remove('selected'));
      el.classList.add('selected');
      const certa=q.resp;
      if(el.dataset.l===certa){acertos++;el.classList.add('correct')}else{el.classList.add('wrong');document.querySelector(`[data-l="${certa}"]`).classList.add('correct')}
      sCount.textContent=`${acertos} ${T_UI[lang].acertos}`;
      document.getElementById('nextBtn').disabled=false
    }
  });
  document.getElementById('nextBtn').onclick=()=>{atual++;if(atual<quizData.length)render();else final()}
}
function final(){
  bar.style.width=`100%`;
  const t=T_UI[lang];
  card.innerHTML=`<div class="result"><h2>${acertos}/${(QUIZ[lang]||QUIZ.pt).length}</h2><p>${acertos===(QUIZ[lang]||QUIZ.pt).length?t.msg_win:acertos>10?t.msg_mid:t.msg_low}</p><br><button class="btn" onclick="location.reload()">${t.refazer}</button></div>`
}
setLang(lang);
const nav=document.getElementById('prismaNav'),btn=document.getElementById('btnMenu');
btn.addEventListener('click',(e)=>{e.stopPropagation();nav.classList.toggle('menu-aberto');document.body.style.overflow=nav.classList.contains('menu-aberto')?'hidden':''});
</script>
</body>
</html>
